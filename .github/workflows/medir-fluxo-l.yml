# Medição do Lote L (SeeDropHost): não publica nada. Mede o que o GitHub faz com dois jobs, artefato, OIDC e agenda.
# Para a sessão da prova: gravar em .github/workflows/medir-fluxo-l.yml do realyossa/seedrop-ensaio-c6 (commit com
# "[skip ci]" na mensagem para não disparar o fluxo de publicar), rodar à mão uma vez, rodar de novo a mesma execução
# (re-run: o artefato de mesmo nome é aceito?), esperar uma execução agendada e depois APAGAR o arquivo.
# Responde o que o estudo 25 deixou como não conferido: F1d, F1e, F4b, F4c (re-run), F10c, F11b, F11c.
name: Medir o fluxo do Lote L (nao publica)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Medir o job que constroi
        shell: bash
        run: |
          set +e
          . /etc/os-release
          echo "imagem: Ubuntu $VERSION_ID ($ImageVersion)"
          echo "node: $(node --version) npm: $(npm --version)"
          echo "evento: $GITHUB_EVENT_NAME ref: $GITHUB_REF"
          echo "commits: $(git rev-list --count HEAD) raso: $(git rev-parse --is-shallow-repository)"
          git fetch --unshallow; echo "git fetch --unshallow saiu com $?"
          echo "sem id-token: URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-ausente} TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+definido}"
          printf 'pacote de teste %s\n' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/site.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seedrophost-site
          path: ${{ runner.temp }}/site.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seedrophost-site
          path: ${{ runner.temp }}/sdh-pacote
      - name: Medir o job que envia
        shell: bash
        run: |
          . /etc/os-release
          echo "imagem: Ubuntu $VERSION_ID ($ImageVersion)"
          ls -la "$RUNNER_TEMP/sdh-pacote"; cat "$RUNNER_TEMP/sdh-pacote/site.zip"
          echo "pasta de trabalho: $(ls -A "$GITHUB_WORKSPACE" | wc -l) itens"
          for i in 1 2; do
            t=$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | curl -fsS -K - "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=medicao" | jq -r '.value // empty')
            [ -n "$t" ] || { echo "sem token"; exit 1; }
            echo "::add-mask::$t"
            # só os campos da credencial (o corpo não é segredo; a assinatura nunca é impressa)
            printf '%s' "$t" | jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {event_name, ref, ref_type, workflow_ref, job_workflow_ref, aud, validade_s: (.exp - .iat), jti, actor, repository, run_attempt, sub}'
          done
